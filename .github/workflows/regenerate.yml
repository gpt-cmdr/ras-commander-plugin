name: Regenerate from library main

# Pins ras-commander and hms-commander to the current head of their tracked
# branch (main), rebuilds the plugin's skills with each library's own
# generator, and, when anything changed, validates the result, bumps the plugin
# patch version, and pushes the commit to main so `claude plugin update` and the
# session-start update notice pick it up. It never publishes to PyPI or
# installs anything for users.

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [library-release, library-main-updated]

permissions:
  contents: write

concurrency:
  group: regenerate
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate from the head of each library's main
        id: build
        run: python tools/build_content.py --latest --bump-on-change
      - name: Validate regenerated plugin
        if: steps.build.outputs.changed == 'true'
        run: |
          python tools/validate.py
          python tools/build_content.py --check
      - name: Commit and push to main
        if: steps.build.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version=$(python -c "import json; print(json.load(open('plugins/ras-commander/.claude-plugin/plugin.json'))['version'])")
          commits=$(python -c "import json; print(', '.join(f\"{l['id']}@{l['commit'][:7]}\" for l in json.load(open('build/sources.json'))['libraries']))")
          git add -A
          git commit -m "Regenerate skills from library main (plugin $version)" -m "Sources: $commits"
          git push origin HEAD:main

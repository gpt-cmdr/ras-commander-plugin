name: Regenerate from latest library releases

# Rebuilds the plugin's skills from the newest ras-commander and hms-commander
# PyPI releases (their git tags) and opens a pull request when anything changed.
# It never merges, publishes, or installs anything.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  repository_dispatch:
    types: [library-release]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: regenerate
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate from latest releases
        id: build
        run: python tools/build_content.py --latest --bump-on-change
      - name: Validate regenerated plugin
        if: steps.build.outputs.changed == 'true'
        run: python tools/validate.py
      - name: Open pull request
        if: steps.build.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/regenerate-skills
          delete-branch: true
          commit-message: "Regenerate skills from latest library releases"
          title: "Regenerate skills from latest library releases"
          body: |
            Automated regeneration by `tools/build_content.py --latest --bump-on-change`.

            - Skills are generated by each library release's own `build_plugin.py`; see `plugins/ras-commander/provenance/`.
            - The plugin patch version was bumped so `claude plugin update` picks the change up.
            - Review the skill diff, run `claude plugin validate plugins/ras-commander` locally, and merge manually.
          labels: automation

name: Update plugin channels

on:
  push:
    branches: [main]
  schedule:
    # Weekly recovery for missed notifications: Monday, 10:23 UTC.
    - cron: "23 10 * * 1"
  workflow_dispatch:
  repository_dispatch:
    types: [library-release, library-main-updated]

permissions:
  contents: write

concurrency:
  group: regenerate
  cancel-in-progress: false

jobs:
  channels:
    runs-on: ubuntu-latest
    outputs:
      channels: ${{ steps.choose.outputs.channels }}
    steps:
      - id: choose
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
        run: |
          if [ "$EVENT" = push ] || [ "$ACTION" = library-main-updated ]; then
            echo 'channels=["latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'channels=["release","latest"]' >> "$GITHUB_OUTPUT"
          fi
  regenerate:
    needs: channels
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.channels.outputs.channels) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Build, validate, and publish channel
        run: python tools/update_channel.py --channel ${{ matrix.channel }} --publish
